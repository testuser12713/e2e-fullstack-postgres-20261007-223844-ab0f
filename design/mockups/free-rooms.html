<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freie Räume — Raumbuchung</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
        </span>
        <span class="brand-name">Raumbuchung</span>
      </a>
      <nav class="navtabs" aria-label="Hauptnavigation">
        <a class="navtab" href="index.html">Räume</a>
        <a class="navtab" href="day-view.html">Tagesansicht</a>
        <a class="navtab is-active" href="free-rooms.html" aria-current="page">Freie Räume</a>
      </nav>
      <div class="health" role="status" title="GET /api/health → {&quot;status&quot;:&quot;ok&quot;,&quot;database&quot;:&quot;ok&quot;}">
        <span class="health-dot"></span>
        <span class="health-label">API ok</span>
      </div>
    </div>
  </header>

  <main class="container page" data-od-id="free-screen">
    <div class="page-head" data-od-id="free-head">
      <h1 class="page-title" data-od-id="free-title">Freie Räume</h1>
      <p class="page-subtitle">Zeitraum und Mindestplätze eingeben, um verfügbare Räume zu finden.</p>
    </div>

    <div class="card form-card" style="margin-bottom: 32px;" data-od-id="free-search-card">
      <form id="free-form" novalidate>
        <div class="time-range-group">
          <div class="field">
            <label class="field-label" for="s-date">Datum</label>
            <input class="input num" id="s-date" type="date" value="2026-04-14">
          </div>
          <div class="field">
            <label class="field-label" for="s-start">Beginn</label>
            <input class="input num" id="s-start" type="time" step="300" value="09:00">
          </div>
          <div class="field">
            <label class="field-label" for="s-end">Ende</label>
            <input class="input num" id="s-end" type="time" step="300" value="10:30">
          </div>
        </div>

        <div class="field" style="margin-top: 16px;">
          <label class="field-label" for="s-seats">Mindestplätze</label>
          <input class="input num" id="s-seats" type="number" min="1" step="1" placeholder="—" inputmode="numeric" style="width: 96px;">
        </div>

        <div class="row" style="justify-content: flex-end; gap: 8px; margin-top: 24px;">
          <button class="btn btn-primary" id="search-btn" type="submit">Suchen</button>
        </div>
      </form>
    </div>

    <div id="free-results" data-od-id="free-results">
      <p class="muted" id="free-hint" style="font-size: var(--size-small);">Zeitraum eingeben und auf „Suchen“ klicken.</p>
    </div>

    <div class="empty-state" id="free-empty" hidden data-od-id="free-empty">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <div class="empty-title">Kein freier Raum in diesem Zeitraum</div>
      <div class="empty-text">Versuche einen kürzeren Zeitraum oder weniger Plätze.</div>
    </div>
  </main>

  <script>
    (function () {
      var ROOMS = [
        { name: 'Konferenzraum Nord', seats: 8, equipment: ['Beamer', 'Whiteboard', 'Videokonferenz'] },
        { name: 'Besprechung Mitte', seats: 4, equipment: ['Whiteboard', 'Videokonferenz'] },
        { name: 'Fokusraum A', seats: 2, equipment: [] },
        { name: 'Kreativ-Lounge', seats: 10, equipment: ['Beamer', 'Flipchart', 'Videokonferenz'] },
        { name: 'Fokusraum B', seats: 2, equipment: [] },
        { name: 'Telefonzelle 1', seats: 1, equipment: [] }
      ];

      var form = document.getElementById('free-form');
      var results = document.getElementById('free-results');
      var hint = document.getElementById('free-hint');
      var empty = document.getElementById('free-empty');
      var searchBtn = document.getElementById('search-btn');

      var SEAT_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>';

      function toMinutes(t) { return (+t.slice(0, 2)) * 60 + (+t.slice(3, 5)); }

      function overlaps(s, e) {
        // Konferenzraum Nord is booked 09:00–10:30 on 2026-04-14.
        var date = document.getElementById('s-date').value;
        if (date !== '2026-04-14') return false;
        var cStart = 540, cEnd = 630;
        return !(e <= cStart || s >= cEnd);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var date = document.getElementById('s-date').value;
        var start = document.getElementById('s-start').value;
        var end = document.getElementById('s-end').value;
        var seatsVal = document.getElementById('s-seats').value;
        var minSeats = seatsVal === '' ? null : parseInt(seatsVal, 10);

        var s = toMinutes(start), en = toMinutes(end);

        hint.hidden = true;
        empty.hidden = true;

        results.setAttribute('aria-busy', 'true');
        results.innerHTML =
          '<div class="room-grid">' +
            '<div class="skeleton" style="height: 148px;"></div>' +
            '<div class="skeleton" style="height: 148px;"></div>' +
            '<div class="skeleton" style="height: 148px;"></div>' +
          '</div>' +
          '<span class="visually-hidden">Laden…</span>';

        setTimeout(function () {
          var list = ROOMS.filter(function (r) {
            if (r.name === 'Konferenzraum Nord' && overlaps(s, en)) return false;
            if (minSeats !== null && r.seats < minSeats) return false;
            return true;
          });

          results.setAttribute('aria-busy', 'false');

          if (list.length === 0) {
            results.innerHTML = '';
            empty.hidden = false;
            return;
          }

          results.innerHTML =
            '<h2 style="font-size: var(--size-h2); font-weight: 600; margin-bottom: 16px;">' + list.length + ' freie Räume</h2>' +
            '<div class="room-grid">' + list.map(function (r, idx) {
              var equip = r.equipment.length
                ? r.equipment.map(function (eq) { return '<span class="equip-chip">' + eq + '</span>'; }).join('')
                : '<span class="equip-empty">Keine Ausstattung angegeben</span>';
              return '' +
                '<article class="room-card" data-od-id="free-room-' + idx + '">' +
                  '<div class="room-card-head">' +
                    '<h3 class="room-card-name">' + r.name + '</h3>' +
                    '<span class="seats-badge">' + SEAT_ICON + r.seats + ' Plätze</span>' +
                  '</div>' +
                  '<div class="equip-chips">' + equip + '</div>' +
                  '<div class="room-card-foot">' +
                    '<a class="btn btn-secondary btn-sm" href="day-view.html?room=' + encodeURIComponent(r.name) + '&date=' + date + '">Tag anzeigen</a>' +
                    '<a class="btn btn-primary btn-sm" href="booking.html?room=' + encodeURIComponent(r.name) + '&date=' + date + '">Buchen</a>' +
                  '</div>' +
                '</article>';
            }).join('') + '</div>';
        }, 700);
      });
    })();
  </script>
</body>
</html>
